# ~/.config/hypr/hyprlock.conf

# Estilo do monitor (aplica blur na tela inteira)
general {
    # O blur é essencial para o look cyberpunk
    # Ajuste o 'size' e 'passes' para a performance do T480
    disable_loading_bar = true 
    grace = 10
    ignore_empty_input = true
}

background {
    monitor =  
    path = ~/.config/background/rayquaza.jpg
    color = rgba(000000AA) # Fundo preto semi-transparente
    # Configurações de BLUR
    blur_size = 0
    blur_passes = 0
}

# Elemento principal: Anel de digitação de senha (EVA Power Indicator)
input-field {
    monitor = 
    size = 150, 30
    outline_thickness = 3
    # Cores (Roxo Intenso/Verde Neon)
    inner_color = rgb(180026) # Roxo escuro
    outer_color = rgb(8B008B) # Roxo
    fail_color = rgb(FF4500) # Laranja/Vermelho para erro (Modo Berserk!)
    check_color = rgb(39FF14) # Verde Neon para sucesso

    font_color = rgb(FFFFFF)
    fade_on_empty = false
    placeholder_text = < NERV SYSTEM >
    # Posição centralizada
    position = 25, -300
    halign = center
    valign = center
}
